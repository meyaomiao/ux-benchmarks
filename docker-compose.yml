services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ux_benchmarks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q adapters,scoring
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    depends_on: [postgres, redis]

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on: [backend]

volumes:
  postgres_data:
