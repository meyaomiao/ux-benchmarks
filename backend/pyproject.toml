[project]
name = "ux-benchmarks-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "pillow>=10.3",
    "imagehash>=4.3",
    "anthropic>=0.28",
    "ddgs>=9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package name (ux-benchmarks-backend) differs from the import dir (app/),
# so tell hatchling exactly what to include or `pip install -e` fails to
# locate the package.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
